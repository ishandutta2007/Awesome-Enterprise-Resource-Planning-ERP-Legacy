<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #e2e8f0; letter-spacing: 0.5px; }
      .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; }
      
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-10px) scale(1.05); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      @keyframes gridSlide {
        0% { transform: stroke-dashoffset; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 50; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6px; fill: #38bdf8; }
        50% { r: 9px; fill: #f43f5e; }
      }
      .bg-grid { stroke: #334155; stroke-width: 1; stroke-opacity: 0.25; stroke-dasharray: 5 5; }
      .dynamic-orb-1 { animation: floatPulse 6s ease-in-out infinite; }
      .dynamic-orb-2 { animation: floatPulse 8s ease-in-out infinite 2s; }
      .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Dynamic Background Orbs (Low opacity, strictly behind text) -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" class="dynamic-orb-1" filter="blur(40px)" />
  <circle cx="1050" cy="220" r="140" fill="#8b5cf6" class="dynamic-orb-2" filter="blur(50px)" opacity="0.5" />
  <circle cx="900" cy="60" r="90" fill="#ec4899" class="dynamic-orb-1" filter="blur(45px)" />

  <!-- Decorative Tech Grid (Background) -->
  <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" class="bg-grid" />
  <path d="M 200 0 L 200 300 M 400 0 L 400 300 M 600 0 L 600 300 M 800 0 L 800 300 M 1000 0 L 1000 300" class="bg-grid" />

  <!-- Network / Migration Connection Graphic (Right side, lower opacity to avoid text conflict) -->
  <g opacity="0.35">
    <line x1="850" y1="210" x2="950" y2="150" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="950" y1="150" x2="1080" y2="190" stroke="#818cf8" stroke-width="2" />
    <line x1="950" y1="150" x2="1020" y2="90" stroke="#818cf8" stroke-width="2" />
    <circle cx="850" cy="210" r="6" fill="#38bdf8" />
    <circle cx="950" cy="150" class="pulse-node" />
    <circle cx="1080" cy="190" r="5" fill="#c084fc" />
    <circle cx="1020" cy="90" r="7" fill="#38bdf8" />
  </g>

  <!-- Foreground Main Card Container -->
  <rect x="50" y="40" width="1100" height="220" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />

  <!-- Badge / Pill Above Title -->
  <rect x="80" y="70" width="220" height="28" rx="14" fill="url(#accentGrad)" />
  <text x="190" y="89" text-anchor="middle" class="tag">⚡ ENTERPRISE ERP ECOSYSTEM</text>

  <!-- Title and Subtitle (Ensured high contrast and fully in foreground) -->
  <text x="80" y="145" class="title" filter="url(#glow)">Awesome Enterprise Resource Planning (ERP)</text>
  <text x="80" y="185" class="subtitle">Legacy ERP Platforms, Sunset Timelines, SaaS &amp; Open-Source Alternatives</text>

  <!-- Feature Pills at Bottom of Card -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="75" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">🏛️ Legacy Platforms</text>

    <rect x="165" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="250" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">🔓 Open-Source Suites</text>

    <rect x="350" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="430" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">☁️ SaaS &amp; Cloud ERP</text>

    <rect x="525" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="610" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">⏳ Migration Timelines</text>
  </g>
</svg>
